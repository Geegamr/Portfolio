name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund libsodium-wrappers @types/node && bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
      - name: Generate temporary public/private key pair for the build
        run: |
          node --input-type=module <<'NODE'
          import sodium from 'libsodium-wrappers'
          import { appendFileSync } from 'node:fs'
          await sodium.ready
          const pair = sodium.crypto_box_keypair()
          const b64 = sodium.base64_variants.ORIGINAL
          appendFileSync(process.env.GITHUB_ENV, 'GITHUB_PAGES_PRIVATE_KEY=' + sodium.to_base64(pair.privateKey, b64) + String.fromCharCode(10))
          console.log(`public-key=${sodium.to_base64(pair.publicKey, b64)}`)
          NODE
      - name: Prepare Web3Forms Actions secret
        run: node .github/scripts/prepare-web3forms-secret.mjs
        env:
          WEB3FORMS_ACTIONS_SECRET: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build site for GitHub Pages
        run: bun run build
        env:
          GITHUB_ACTIONS: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
